name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-bot:
    name: Test Bot (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

      - name: Run ruff check
        run: ruff check bot/ tests/

      - name: Run ruff format check
        run: ruff format --check bot/ tests/

  lint-dashboard:
    name: Lint Dashboard (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check playback controls
        run: npm run check:single-playback-controls

  build-docker:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bot image
        run: docker build -t discord-music-bot:ci .

      - name: Build dashboard image
        run: docker build -t discord-music-bot-dashboard:ci ./dashboard
